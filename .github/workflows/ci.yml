name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy echo tests

      - name: Test
        run: pytest -q

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check changelog updated
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md must be updated for pull requests."
            exit 1
          fi

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check release version consistency
        run: |
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          version_changed=false
          changelog_release_added=false

          if echo "$changed_files" | grep -qx "echo/version.py"; then
            version_changed=true
          fi

          if git diff origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md \
            | grep -E '^\+## \[[0-9]+\.[0-9]+\.[0-9]+'; then
            changelog_release_added=true
          fi

          if [ "$version_changed" = false ] && [ "$changelog_release_added" = false ]; then
            echo "No release version change detected."
            exit 0
          fi

          if [ "$version_changed" = true ] && [ "$changelog_release_added" = false ]; then
            echo "echo/version.py changed, but CHANGELOG.md does not add a matching release heading."
            exit 1
          fi

          if [ "$version_changed" = false ] && [ "$changelog_release_added" = true ]; then
            echo "CHANGELOG.md adds a release heading, but echo/version.py was not changed."
            exit 1
          fi

          package_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' echo/version.py)"
          if [ -z "$package_version" ]; then
            echo "Could not parse __version__ from echo/version.py."
            exit 1
          fi

          if ! grep -q "^## \[$package_version\]" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a release heading for $package_version."
            exit 1
          fi
