[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-bpsd"
dynamic = ["version"]
description = "ECHO: Bayesian paralog signal deconvolution for CYP2D copy-number and hybrid breakpoint calling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ram Nanduri" }
]
maintainers = [
  { name = "Ram Nanduri" }
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.urls]
Developer = "https://github.com/ramsainanduri"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.8",
  "pre-commit>=3.6",
  "pandas-stubs>=2.0",
  "scipy-stubs>=1.10"
]

[project.scripts]
echo = "echo.cli:main"
echo-bpsd = "echo.cli:main"

[tool.setuptools.packages.find]
include = ["echo*"]

[tool.setuptools.dynamic]
version = { attr = "echo.version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
